
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Embed Generator</title>
<style>
body {
    background: #111214;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}
pre {
    background: #1e1f22;
    padding: 15px;
    border-radius: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
button {
    background: #5865f2;
    color: white;
    border: 0;
    padding: 12px 20px;
    border-radius: 7px;
    cursor: pointer;
}
</style>
</head>
<body>
<h2>Discord Embed Generator</h2>
<p>Maximum valid embed JSON</p>
<button onclick="copyJSON()">Copy JSON</button>
<pre id="output"></pre>

<script>
const troll = "𒐫";

const embed = {
    title: troll.repeat(256),
    description: troll.repeat(4096),
    color: 0xFF0000,
    fields: [],
    footer: {
        text: "𒐫".repeat(2048)
    }
};

// Discord allows 6000 combined characters.
// Fill the remaining available space.
let used = embed.title.length +
           embed.description.length +
           embed.footer.text.length;

let remaining = 6000 - used;

embed.fields = [];

const json = {
    embeds: [embed]
};

document.getElementById("output").textContent =
    JSON.stringify(json, null, 2);

function copyJSON() {
    navigator.clipboard.writeText(
        JSON.stringify(json, null, 2)
    ).then(() => alert("Copied!"));
}
</script>
</body>
</html>
